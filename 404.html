<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ページが見つかりません | Stracto株式会社</title>

  <meta name="robots" content="noindex, follow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f7fa;
      color: #1f2937;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    main {
      width: 100%;
      max-width: 640px;
      padding: 48px 32px;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 32px;
    }

    p {
      margin: 0 0 32px;
      line-height: 1.8;
      color: #4b5563;
    }

    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      background: #111827;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>

    <p>
      お探しのページは削除されたか、URLが変更された可能性があります。
    </p>

    <a href="/">トップページへ戻る</a>
  </main>
</body>
</html>
